name: Refresh Instagram Token

on:
  schedule:
    - cron: "31 14 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: meme-bot-token-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout application code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check and refresh token
        id: refresh
        env:
          PYTHONPATH: ${{ github.workspace }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          FB_APP_ID: ${{ secrets.FB_APP_ID }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
          REFRESH_THRESHOLD_DAYS: ${{ vars.REFRESH_THRESHOLD_DAYS || '21' }}
          GRAPH_VERSION: ${{ vars.GRAPH_VERSION || 'v22.0' }}
          REFRESHED_TOKEN_PATH: new_access_token.txt
        run: python scripts/refresh_instagram_token.py

      - name: Update ACCESS_TOKEN secret
        if: steps.refresh.outputs.refreshed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
        run: |
          gh secret set ACCESS_TOKEN --repo "${GITHUB_REPOSITORY}" < new_access_token.txt
          rm -f new_access_token.txt
