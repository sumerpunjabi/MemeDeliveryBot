name: Collect Instagram Analytics

on:
  schedule:
    - cron: "26 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: meme-bot-state
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout application code
        uses: actions/checkout@v4
        with:
          path: app

      - name: Prepare state branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          rm -rf bot-state
          if git ls-remote --exit-code --heads "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" bot-state >/dev/null 2>&1; then
            git clone --branch bot-state --single-branch "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" bot-state
          else
            mkdir bot-state
            cd bot-state
            git init
            git checkout -b bot-state
            git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          fi

      - name: Ensure performance store exists
        run: |
          mkdir -p bot-state/state
          if [ ! -f bot-state/state/performance.json ]; then
            printf '{"version":1,"meta":{},"posts":[]}\n' > bot-state/state/performance.json
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: app
        run: pip install -r requirements.txt

      - name: Collect analytics
        working-directory: app
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          GRAPH_VERSION: ${{ vars.GRAPH_VERSION || 'v22.0' }}
          REQUEST_TIMEOUT_SECONDS: ${{ vars.REQUEST_TIMEOUT_SECONDS || '20' }}
          MAX_RETRY_ATTEMPTS: ${{ vars.MAX_RETRY_ATTEMPTS || '3' }}
          RETRY_BASE_SECONDS: ${{ vars.RETRY_BASE_SECONDS || '2' }}
          INSTAGRAM_INSIGHT_METRICS: ${{ vars.INSTAGRAM_INSIGHT_METRICS || 'likes,comments,saved,shares,reach,views,plays,total_interactions,follows' }}
          ANALYTICS_LOOKBACK_DAYS: ${{ vars.ANALYTICS_LOOKBACK_DAYS || '14' }}
          ANALYTICS_MAX_MEDIA_PER_RUN: ${{ vars.ANALYTICS_MAX_MEDIA_PER_RUN || '50' }}
          PERFORMANCE_STORE_PATH: ../bot-state/state/performance.json
          OPTIMIZED_CONFIG_PATH: ../bot-state/state/optimized-config.json
        run: python -m meme_bot.analytics_runner

      - name: Commit analytics update
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd bot-state
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/performance.json
          if git diff --cached --quiet; then
            echo "No analytics changes to commit."
            exit 0
          fi
          git commit -m "Update Instagram analytics"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:bot-state
